# Model: pick a preset below or any LiteLLM "<provider>/<model>" string. The API key is NEVER stored here:
# it is read from AI_API_KEY or, if that is unset, from the provider's own variable (GEMINI_API_KEY,
# OPENAI_API_KEY, DASHSCOPE_API_KEY, GROQ_API_KEY, ...). Local models (Ollama) need no key.
#
# Choose without editing this file:  make run MODEL=gemini   (or --model / HARNESS_MODEL)
# name: auto picks the preset from the key's format (gsk_ -> groq, AIza -> gemini, sk-proj- -> openai,
# sk-or- -> openrouter) or, without AI_API_KEY, from whichever provider variable is set.
#
# context_window: null reads the window from LiteLLM's model table (32768 when unknown). It drives the
# context budgets: working_budget_tokens is capped at 55% of it and max_tool_output_chars at ~6% of it (see
# harness/config.py), so a 32k model never gets a 48k prompt. api_base, context_window, tokens_per_minute,
# reasoning_effort and force_text_mode_for describe one model, so they reset when another model is selected.
model:
  name: auto
  api_base: null               # set only for OpenAI-compatible endpoints
  temperature: 0.0             # null = provider default
  seed: 42
  max_output_tokens: 4096
  context_window: null
  tokens_per_minute: null      # provider input-token rate limit; null = unknown (learned from the first error).
                               # One prompt above it is always rejected, so it caps the context budgets.
  reasoning_effort: null       # low | medium | high for reasoning models; null = provider default
  tool_mode: auto             # auto | native | text  (auto = probe the endpoint once; keep auto)
  force_text_mode_for: []     # case-insensitive substrings of name that skip the probe and use text mode
  max_consecutive_parse_failures: 3   # end a phase (reason protocol_failure) after this many unparseable replies
  request_timeout_s: 120
  max_retries: 5
presets:                       # model settings applied by name: make run MODEL=<preset>
  groq:                        # key: gsk_... (GROQ_API_KEY)
    name: "groq/qwen/qwen3.8-27b"
    tokens_per_minute: 8000    # Groq on_demand tier for this model
    force_text_mode_for: ["qwen3"]   # Groq's native tool calling for this model proved unreliable in live probing
  gemini:                      # key: AIza... (GEMINI_API_KEY) from Google AI Studio
    name: "gemini/gemini-3.5-flash"
    temperature: null          # Google recommends the default (1.0) for Gemini 3; lower values can cause looping
    reasoning_effort: low      # thinking tokens count against max_output_tokens
    max_output_tokens: 8192
  openai:                      # key: sk-proj-... (OPENAI_API_KEY)
    name: "openai/gpt-5.4-mini"
    temperature: null          # reasoning models accept only the default
    reasoning_effort: low
    max_output_tokens: 8192
  qwen:                        # Alibaba Model Studio key (DASHSCOPE_API_KEY), international (Singapore) region
    name: "dashscope/qwen3-coder-plus"
    api_base: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
  qwen-cn:                     # the same model for a key from the China (Beijing) region
    name: "dashscope/qwen3-coder-plus"
    api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  openrouter:                  # key: sk-or-... (OPENROUTER_API_KEY)
    name: "openrouter/qwen/qwen3-coder"
  deepseek:                    # DEEPSEEK_API_KEY
    name: "deepseek/deepseek-chat"
  ollama:                      # local model, no key: ollama pull qwen3:8b (Ollama running on this machine)
    name: "ollama_chat/qwen3:8b"
    api_base: "http://localhost:11434"
    context_window: 32768
    request_timeout_s: 600     # local generation is slow on a laptop CPU
budgets:                       # per issue
  max_total_tokens: 120000       # hard cap: the run stops (status budget_exhausted)
  soft_total_tokens: 45000       # beyond this, no new fix attempts are started
  max_llm_calls: 45
  max_wall_clock_s: 900
phases:
  localize_max_steps: 15
  reproduce_max_steps: 10
  fix_max_steps: 25
  max_fix_attempts: 3
  enable_rescue: true
  enable_review: true
context:
  working_budget_tokens: 48000  # compact history above this
  max_tool_output_chars: 8000
  keep_recent_messages: 8
tests:
  command: null                 # override auto-detection, e.g. "python3 -m pytest -q"
  baseline_timeout_s: 300
  targeted_timeout_s: 180
  run_full_suite_after_fix: true
safety:
  allow_edit_existing_tests: false   # purely additive edits to test files are always allowed
  command_timeout_s: 120
output:
  runs_dir: runs
  workspaces_dir: null          # null = <system temp>/ai-harness-workspaces (must be OUTSIDE this project)
spectrum:                        # Tracer: execution-based fault localization
  enabled: true
  formula: ochiai            # ochiai | tarantula
  timeout_s: 120             # total budget for all traced runs
  repro_timeout_s: 60        # sub-budget so a slow repro cannot starve the passing runs
  min_passing_runs: 3        # below this -> ok=False (no contrast, everything ties)
  max_passing_tests: 60      # tracing is 2-10x slower than normal execution; keep this modest
  top_lines: 10              # lines shown to the FIX agent
  top_functions: 5
  max_evidence_chars: 5000   # capped again at runtime against the model's context window
